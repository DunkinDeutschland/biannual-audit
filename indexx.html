async function goToExport(auditId){
  let audit = state.audits[auditId];
  if(!audit){ audit = await storageGet('audit:'+auditId); state.audits[auditId] = audit; }
  if(audit.status !== 'finished'){
    audit.status = 'finished';
    await storageSet('audit:'+audit.id, audit);
    const idx = state.auditIndex.find(a=>a.id===audit.id);
    if(idx){
      idx.status = 'finished';
      idx.pct = computeScore(state.config[audit.brand], audit.answers).pct;
      const split = computeSplitScore(state.config[audit.brand], audit.answers);
      idx.perfPct = split.performance.pct;
      idx.opsPct = split.operational.pct;
      idx.year = audit.year; idx.semester = audit.semester;
      await storageSet('audit_index', state.auditIndex);
    }
  }
  state.viewingExport = auditId;
  render();
}
function closeExport(){ state.viewingExport = null; render(); }

function renderExportView(main, auditId){
  const audit = state.audits[auditId];
  const brand = state.config[audit.brand];
  const {earned, denom, pct} = computeScore(brand, audit.answers);

  main.innerHTML = `
    <div class="no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;">
      <button class="btn btn-sm" id="back-btn">← Back</button>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn" id="briefing-btn">✨ Store briefing</button>
        <button class="btn" id="translate-btn">🌐 Translate notes to German</button>
        <button class="btn btn-primary" id="print-btn">Download / print PDF</button>
        <button class="btn" id="email-btn">Email report</button>
      </div>
    </div>
    <div id="briefing-result" class="no-print" style="max-width:900px;margin:0 auto 14px;"></div>
    <div id="translate-status" class="hint no-print" style="margin-bottom:10px;"></div>
    <div class="card" id="report-doc" style="max-width:900px;margin:0 auto;">
      ${reportDocHTML(audit, brand)}
    </div>
  `;

  document.getElementById('back-btn').addEventListener('click', closeExport);
  document.getElementById('print-btn').addEventListener('click', ()=>{ window.print(); });
  document.getElementById('briefing-btn').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    const store = state.stores.find(s=>s.id===audit.storeId);
    const resultEl = document.getElementById('briefing-result');
    btn.disabled = true; btn.textContent = 'Generating…';
    resultEl.innerHTML = '';
    const {text, error} = await generateStoreBriefing(store);
    btn.disabled = false; btn.textContent = '✨ Store briefing';
    if(error){ resultEl.innerHTML = `<div class="card"><p class="hint" style="margin:0;">${esc(error)}</p></div>`; return; }
    resultEl.innerHTML = `<div class="card" style="font-size:13px;line-height:1.5;">${briefingBoxHTML(text)}</div>`;
  });
  document.getElementById('translate-btn').addEventListener('click', async ()=>{
    const statusEl = document.getElementById('translate-status');
    statusEl.textContent = 'Translating notes…';
    const {count, failed} = await translateAudit(audit, (done,total)=>{ statusEl.textContent = `Translating notes… ${done}/${total}`; });
    await storageSet('audit:'+audit.id, audit);
    if(count === 0){
      statusEl.textContent = 'No notes to translate.';
    } else if(failed){
      statusEl.innerHTML = '<span style="color:var(--red);">⚠ Translation didn\'t go through — this feature only works while using the app inside Claude, not on a standalone-hosted copy (like Netlify). Notes are still in English.</span>';
    } else {
      statusEl.textContent = 'Notes translated to German ✓';
    }
    document.getElementById('report-doc').innerHTML = reportDocHTML(audit, brand);
  });
  document.getElementById('email-btn').addEventListener('click', ()=>openEmailModal(audit, pct));
}

function isUSStore(storeName){ return /\bUS\b/.test(storeName||''); }

function reportDocHTML(audit, brand){
  const {earned, denom, pct} = computeScore(brand, audit.answers);
  const split = computeSplitScore(brand, audit.answers);
  const pctStr = pct===null ? '—' : Math.round(pct)+'%';
  const primaryLang = isUSStore(audit.storeName) ? 'en' : 'de';

  const sectionsHTML = brand.sections.map(sec=>{
    const secPrimary = primaryLang==='en' ? sec.name_en : sec.name_de;
    const secSecondary = primaryLang==='en' ? sec.name_de : sec.name_en;
    const subsHTML = sec.subs.map(sub=>{
      const subPrimary = primaryLang==='en' ? sub.name_en : sub.name_de;
      const subSecondary = primaryLang==='en' ? sub.name_de : sub.name_en;
      const rows = sub.questions.map(q=>{
        const a = audit.answers[q.id] || {};
        const w = Math.round(Number(q.weight)||1);
        const multi = isMultiPoint(q.weight);
        let statusBadge;
        if(a.status === 'na') statusBadge = '<span class="badge badge-na">N/A</span>';
        else if(multi && typeof a.points === 'number') statusBadge = `<span class="badge ${a.points>=w?'badge-pass':a.points===0?'badge-fail':'badge-na'}">${a.points}/${w}</span>`;
        else if(a.status === 'pass') statusBadge = '<span class="badge badge-pass">PASS</span>';
        else if(a.status === 'fail') statusBadge = '<span class="badge badge-fail">FAIL</span>';
        else statusBadge = '<span class="badge badge-na">—</span>';
        const photos = (a.photos||[]).map(p=>`<img src="${p}" style="width:90px;height:90px;object-fit:cover;border-radius:6px;margin:4px 6px 0 0;border:1px solid #E4E2DA;">`).join('');
        const badge = scorecardBadgeHTML(audit.brand, audit.storeName, q.text_en);
        const googleBox = googleReviewInfoHTML(audit.brand, audit.storeName, q.text_en);
        const qPrimary = primaryLang==='en' ? q.text_en : q.text_de;
        const qSecondary = primaryLang==='en' ? q.text_de : q.text_en;
        const notEnough = '<i style="color:#B3B0A3">not yet translated — click “Translate notes”</i>';
        let notePrimaryHTML, noteSecondaryHTML;
        if(primaryLang==='en'){
          notePrimaryHTML = esc(a.note_en||'');
          noteSecondaryHTML = a.note_de ? esc(a.note_de) : (a.note_en ? notEnough : '');
        } else {
          notePrimaryHTML = a.note_de ? esc(a.note_de) : (a.note_en ? notEnough : '');
          noteSecondaryHTML = esc(a.note_en||'');
        }
        return `
          <tr>
            <td style="width:34%">
              <div style="font-weight:600;font-size:13px;">${esc(qPrimary)}${badge}</div>
              <div style="font-size:11.5px;color:#8B8A80;font-style:italic;">${esc(qSecondary)}</div>
              ${googleBox}
            </td>
            <td style="width:8%;text-align:center;">${statusBadge}</td>
            <td style="width:29%;font-size:13px;font-weight:600;">${notePrimaryHTML}</td>
            <td style="width:29%;font-size:11.5px;color:#8B8A80;font-style:italic;">${noteSecondaryHTML}</td>
          </tr>
          ${photos ? `<tr><td colspan="4" style="padding-top:0;">${photos}</td></tr>` : ''}
        `;
      }).join('');
      return `
        <div style="margin:14px 0 6px;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;color:#3A4250;">${esc(subPrimary)} <span style="text-transform:none;font-weight:500;color:#8B8A80;">/ ${esc(subSecondary)}</span></div>
        <table><thead><tr>
          <th>${primaryLang==='en'?'Question / Frage':'Frage / Question'}</th>
          <th style="text-align:center">${primaryLang==='en'?'Result':'Ergebnis'}</th>
          <th>${primaryLang==='en'?'Note (EN)':'Notiz (DE)'}</th>
          <th>${primaryLang==='en'?'Notiz (DE)':'Note (EN)'}</th>
        </tr></thead><tbody>${rows}</tbody></table>
      `;
    }).join('');
    return `
      <div style="page-break-inside:avoid; margin-bottom:18px;">
        <h2 style="font-size:16px;border-bottom:2px solid #1B2027;padding-bottom:5px;margin-bottom:4px;">${esc(secPrimary)} <span style="color:#B3B0A3;font-weight:500;font-size:13px;">/ ${esc(secSecondary)}</span></h2>
        ${subsHTML}
      </div>
    `;
  }).join('');

  const mastheadPrimary = primaryLang==='en' ? 'Biannual Audit Report' : 'Halbjahresaudit-Bericht';
  const mastheadSecondary = primaryLang==='en' ? 'Halbjahresaudit-Bericht' : 'Biannual Audit Report';

  return `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1B2027;padding-bottom:14px;margin-bottom:18px;">
      <div>
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8B8A80;">${mastheadPrimary} · ${mastheadSecondary}</div>
        <h1 style="font-size:24px;margin:4px 0 2px;">${esc(audit.storeName)}</h1>
        <div style="font-size:13.5px;color:#3A4250;">${esc(brand.name)} · <b>${periodLabel(getPeriod(audit).year, getPeriod(audit).semester)}</b> · Visited ${fmtDate(audit.date)} · Auditor: ${esc(audit.auditor||'—')}</div>
      </div>
      <div style="text-align:center;">
        <div class="mono" style="font-size:34px;font-weight:700;color:${pct===null?'#8B8A80':(pct>=85?'#2E8B57':pct>=70?'#E8A23D':'#C24B3D')}">${pctStr}</div>
        <div style="font-size:11px;color:#8B8A80;">${earned}/${denom} pts · normalized to 100%</div>
        <div style="display:flex;gap:14px;margin-top:8px;justify-content:center;">
          <div style="font-size:11px;color:#8B8A80;">Perf. &amp; Sales<br><span class="mono" style="font-weight:700;font-size:14px;color:${split.performance.pct==null?'#8B8A80':(split.performance.pct>=85?'#2E8B57':split.performance.pct>=70?'#E8A23D':'#C24B3D')};">${split.performance.pct==null?'—':Math.round(split.performance.pct)+'%'}</span></div>
          <div style="font-size:11px;color:#8B8A80;">Operational<br><span class="mono" style="font-weight:700;font-size:14px;color:${split.operational.pct==null?'#8B8A80':(split.operational.pct>=85?'#2E8B57':split.operational.pct>=70?'#E8A23D':'#C24B3D')};">${split.operational.pct==null?'—':Math.round(split.operational.pct)+'%'}</span></div>
        </div>
      </div>
    </div>
    ${sectionsHTML}
  `;
}

/* ---- In-app confirm dialog (native confirm() is blocked in the sandboxed artifact frame) ---- */
function confirmModal(message, okLabel){
  return new Promise(resolve=>{
    const bg = document.createElement('div');
    bg.className = 'modal-bg no-print';
    bg.innerHTML = `
      <div class="modal" style="max-width:420px;">
        <p style="font-size:14px;line-height:1.5;margin:0 0 18px;">${esc(message)}</p>
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button class="btn" id="confirm-cancel">Cancel</button>
          <button class="btn btn-danger" id="confirm-ok">${esc(okLabel||'Delete')}</button>
        </div>
      </div>
    `;
    document.body.appendChild(bg);
    const cleanup = (val)=>{ bg.remove(); resolve(val); };
    bg.querySelector('#confirm-cancel').addEventListener('click', ()=>cleanup(false));
    bg.querySelector('#confirm-ok').addEventListener('click', ()=>cleanup(true));
    bg.addEventListener('click', e=>{ if(e.target===bg) cleanup(false); });
  });
}

function openEmailModal(audit, pct){
  const p = getPeriod(audit);
  const bg = document.createElement('div');
  bg.className = 'modal-bg no-print';
  bg.innerHTML = `
    <div class="modal">
      <h2 style="font-size:16px;margin:0 0 14px;">Email this report</h2>
      <p class="hint" style="margin-bottom:14px;">This opens a draft in your email app with the recipients, subject and a summary pre-filled. <b>Download the PDF first</b> (Download / print PDF) and attach it manually — browsers don't allow auto-attaching files to an email draft.</p>
      <label class="field">Recipients (comma-separated)</label>
      <input type="text" id="email-to" placeholder="manager@company.com, area@company.com" style="margin-bottom:12px;">
      <label class="field">Subject</label>
      <input type="text" id="email-subject" value="Audit report — ${esc(audit.storeName)} — ${periodLabel(p.year,p.semester)}" style="margin-bottom:12px;">
      <label class="field">Message</label>
      <textarea id="email-body" rows="6" style="margin-bottom:16px;">Hi,

Please find attached the audit report for ${audit.storeName} (${state.config[audit.brand].name}), ${periodLabel(p.year,p.semester)}, visited on ${fmtDate(audit.date)}.

Overall score: ${pct===null?'—':Math.round(pct)+'%'}

Best regards,
${audit.auditor||''}</textarea>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn" id="email-cancel">Cancel</button>
        <button class="btn btn-primary" id="email-open">Open email draft</button>
      </div>
    </div>
  `;
  document.body.appendChild(bg);
  bg.querySelector('#email-cancel').addEventListener('click', ()=>bg.remove());
  bg.addEventListener('click', e=>{ if(e.target===bg) bg.remove(); });
  bg.querySelector('#email-open').addEventListener('click', ()=>{
    const to = encodeURIComponent(bg.querySelector('#email-to').value.split(',').map(s=>s.trim()).filter(Boolean).join(','));
    const subject = encodeURIComponent(bg.querySelector('#email-subject').value);
    const body = encodeURIComponent(bg.querySelector('#email-body').value);
    window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
    bg.remove();
  });
}
