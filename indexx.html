<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biannual Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2027;
  --ink-soft:#3A4250;
  --paper:#F5F4F0;
  --card:#FFFFFF;
  --line:#E4E2DA;
  --teal:#1F7A6C;
  --teal-dark:#155A50;
  --teal-bright:#2FB89E;
  --amber:#E8A23D;
  --red:#C24B3D;
  --green:#2E8B57;
  --pink:#EC5D9E;
  --purple:#7C5CFF;
  --DD:#FF6B35;
  --PF:#D9A400;
  --SW:#0F9D58;
  --DND:#2E8B57;
  --radius:14px;
  --shadow:0 1px 2px rgba(27,32,39,.06), 0 4px 14px rgba(27,32,39,.05);
  --shadow-lift:0 8px 24px rgba(27,32,39,.12), 0 2px 6px rgba(27,32,39,.08);
  font-size:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif; letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
#app{display:flex; min-height:100vh;}
@keyframes fadeInUp{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
.main{animation:fadeInUp .35s ease;}

/* ---------- Sidebar nav ---------- */
.sidenav{
  width:212px; flex-shrink:0;
  background:linear-gradient(165deg, #1B2027 0%, #232B38 60%, #1F2E2C 100%);
  color:#EDEDE8;
  display:flex; flex-direction:column;
  padding:20px 14px;
  position:sticky; top:0; height:100vh;
}
.brand-mark{
  display:flex; align-items:center; gap:9px;
  padding:4px 8px 20px 8px;
  border-bottom:1px solid rgba(255,255,255,.12);
  margin-bottom:16px;
}
.brand-mark .dot{width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg, var(--teal-bright), var(--pink)); transform:rotate(45deg); flex-shrink:0; box-shadow:0 0 12px rgba(47,184,158,.5);}
.brand-mark span{font-family:'Space Grotesk'; font-weight:700; font-size:15px; line-height:1.15;}
.navbtn{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:10px; margin-bottom:4px;
  color:#C8C9CE; text-decoration:none; cursor:pointer; border:none; background:none;
  font-size:14px; font-weight:500; width:100%; text-align:left;
  font-family:inherit; transition:all .18s ease;
}
.navbtn:hover{background:rgba(255,255,255,.08); color:#fff; transform:translateX(2px);}
.navbtn.active{background:linear-gradient(135deg, var(--teal-bright), var(--teal)); color:#fff; box-shadow:0 4px 12px rgba(31,122,108,.4);}
.navbtn svg{flex-shrink:0;}
.navfoot{margin-top:auto; font-size:11px; color:#7C8189; padding:8px; line-height:1.5;}
.fab-new-audit{
  position:fixed; top:20px; right:28px; z-index:130;
  padding:11px 20px; font-size:14px; box-shadow:var(--shadow-lift);
  background:linear-gradient(135deg, var(--teal-bright), var(--teal-dark)); border:none;
  transition:transform .15s ease, box-shadow .15s ease;
}
.fab-new-audit:hover{transform:translateY(-2px) scale(1.02); box-shadow:0 12px 28px rgba(31,122,108,.35);}
.sync-badge{
  position:fixed; top:20px; left:232px; z-index:130;
  background:#fff; border:1px solid var(--line); border-radius:20px;
  padding:7px 14px; font-size:11.5px; font-weight:600; color:#3A4250;
  box-shadow:var(--shadow); font-family:inherit; cursor:pointer; transition:all .15s ease;
}
.sync-badge:hover{border-color:var(--teal); transform:translateY(-1px);}

/* ---------- Main area ---------- */
.main{flex:1; min-width:0; padding:28px 34px 60px; max-width:1180px;}
.pagehead{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
.pagehead h1{font-size:23px; margin:0 0 4px; color:var(--ink);}
.pagehead p{margin:0; color:var(--ink-soft); font-size:13.5px;}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:20px 22px; margin-bottom:16px;
  transition:box-shadow .2s ease, transform .2s ease;
}
.btn{
  display:inline-flex; align-items:center; gap:7px; cursor:pointer;
  border:1px solid var(--line); background:#fff; color:var(--ink);
  padding:9px 16px; border-radius:10px; font-size:13.5px; font-weight:600;
  font-family:inherit; transition:all .15s ease;
}
.btn:hover{border-color:var(--teal); color:var(--teal-dark); transform:translateY(-1px); box-shadow:0 4px 10px rgba(27,32,39,.08);}
.btn:active{transform:translateY(0);}
.btn-primary{background:linear-gradient(135deg, var(--teal-bright), var(--teal)); color:#fff; border-color:var(--teal);}
.btn-primary:hover{background:linear-gradient(135deg, var(--teal), var(--teal-dark)); color:#fff; box-shadow:0 6px 16px rgba(31,122,108,.3);}
.btn-danger{color:var(--red); border-color:#EAD1CC;}
.btn-danger:hover{background:#FBEDEA; border-color:var(--red); box-shadow:0 4px 10px rgba(194,75,61,.15);}
.btn-sm{padding:6px 11px; font-size:12.5px;}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none !important; box-shadow:none !important;}
input[type=text], input[type=email], input[type=date], input[type=number], select, textarea{
  font-family:inherit; font-size:13.5px; padding:8px 10px; border:1px solid var(--line);
  border-radius:9px; background:#fff; color:var(--ink); width:100%; transition:border-color .15s ease;
}
textarea{resize:vertical; min-height:56px;}
input:focus, select:focus, textarea:focus{outline:2px solid var(--teal-bright); outline-offset:1px; border-color:var(--teal);}
label.field{display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin-bottom:5px;}
.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:700;}
.badge-pass{background:#E4F3EC; color:var(--green);}
.badge-fail{background:#FAE7E3; color:var(--red);}
.badge-na{background:#EEEDE7; color:#8B8A80;}
.hint{font-size:12px; color:#8B8A80; margin-top:3px;}
table{border-collapse:collapse; width:100%;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); padding:8px 10px; border-bottom:2px solid var(--line);}
td{padding:8px 10px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle;}
tbody tr{transition:background .12s ease;}
tbody tr:hover{background:rgba(31,122,108,.04);}
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:#fff; padding:11px 20px; border-radius:10px; font-size:13.5px;
  box-shadow:var(--shadow-lift); z-index:500; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
.pillrow{display:flex; gap:8px; flex-wrap:wrap;}
.pill{padding:5px 12px; border-radius:20px; font-size:12.5px; font-weight:600; border:1px solid var(--line); cursor:pointer; background:#fff; transition:all .15s ease;}
.pill:hover{transform:translateY(-1px); box-shadow:0 3px 8px rgba(27,32,39,.1);}
.pill.active{color:#fff; border-color:transparent;}
.modal-bg{position:fixed; inset:0; background:rgba(27,32,39,.55); display:flex; align-items:center; justify-content:center; z-index:900; padding:20px; animation:fadeInUp .2s ease;}
.modal{background:#fff; border-radius:16px; padding:24px; max-width:520px; width:100%; max-height:86vh; overflow:auto; box-shadow:var(--shadow-lift);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:#D8D6CD; border-radius:6px;}

/* ---------- Audit form ---------- */
.audit-header{display:flex; gap:18px; align-items:center; flex-wrap:wrap; position:sticky; top:0; z-index:50; background:var(--paper); padding:14px 0 12px;}
.score-dial{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0; transition:background .5s ease; box-shadow:0 2px 10px rgba(31,122,108,.15);}
.score-dial-inner{width:62px;height:62px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16.5px;box-shadow:inset 0 0 0 1px var(--line);}
.store-pill{display:inline-flex;align-items:center;gap:8px;}
.store-pill .swatch{width:9px;height:9px;border-radius:2px;}
.sec-block{margin-bottom:20px;}
.sec-title{font-family:'Space Grotesk'; font-size:16px; font-weight:700; margin:0 0 10px; padding-bottom:6px; border-bottom:2px solid var(--ink);}
.sub-title{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin:14px 0 8px;}
.q-row{display:grid; grid-template-columns:1fr 190px; gap:14px; padding:14px 0; border-bottom:1px solid var(--line);}
.q-text-en{font-size:15.5px; font-weight:700; line-height:1.4; color:var(--ink);}
.q-text-de{font-size:12.5px; color:#8B8A80; margin-top:2px; font-style:italic;}
.q-weight-tag{font-size:11px; font-weight:600; color:#B3B0A3; margin-left:6px;}
.scorecard-badge{display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:12px; margin-left:8px; vertical-align:middle; cursor:help;}
.google-ref-box{margin-top:8px; padding:8px 12px; border-radius:8px; font-size:12.5px; line-height:1.5; border:1px solid transparent;}
.google-ref-good{background:#E4F3EC; border-color:#BFE4D2; color:#1F5C3D;}
.google-ref-mid{background:#FDF3DE; border-color:#F2DFAE; color:#7A5A0F;}
.google-ref-low{background:#FBEDEA; border-color:#EFCFC7; color:#8C2E1F;}
.google-ref-none{background:#EEEDE7; border-color:var(--line); color:#8B8A80; font-style:italic;}
.status-group{display:flex; flex-wrap:wrap; gap:5px; align-content:flex-start; justify-content:flex-end;}
.status-btn{flex:1; padding:7px 0; text-align:center; border-radius:7px; border:1px solid var(--line); background:#fff; font-size:11.5px; font-weight:700; cursor:pointer;}
.status-btn[data-s="pass"].active{background:var(--green); color:#fff; border-color:var(--green);}
.status-btn[data-s="fail"].active{background:var(--red); color:#fff; border-color:var(--red);}
.status-btn[data-s="na"].active{background:#8B8A80; color:#fff; border-color:#8B8A80;}
.pt-btn{flex:0 0 30px; padding:6px 0; font-size:12px;}
.pt-btn.active{background:var(--teal); color:#fff; border-color:var(--teal);}
.pt-btn[data-s="na"]{flex:0 0 40px;}
.q-note{margin-top:9px; min-height:30px; height:30px; padding:6px 34px 6px 10px; overflow:hidden; resize:none; transition:height .08s ease;}
.q-note-wrap{position:relative;}
.mic-btn{position:absolute; top:13px; right:6px; width:24px; height:24px; border-radius:50%; border:none; background:transparent; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1;}
.mic-btn:hover{background:var(--line);}
.mic-btn.listening{background:var(--red); animation:mic-pulse 1.2s infinite;}
@keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(194,75,61,.5);} 50%{box-shadow:0 0 0 6px rgba(194,75,61,0);}}
.q-note:focus{min-height:52px;}
.q-photos{display:flex; gap:8px; flex-wrap:wrap; margin-top:9px;}
.q-photo-thumb{position:relative; width:64px; height:64px; border-radius:6px; overflow:hidden; border:1px solid var(--line);}
.q-photo-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.q-photo-thumb .rm{position:absolute; top:2px; right:2px; background:rgba(27,32,39,.7); color:#fff; border:none; border-radius:50%; width:18px; height:18px; font-size:11px; cursor:pointer; line-height:18px; text-align:center; padding:0;}
.photo-add-btn{width:64px; height:64px; border-radius:6px; border:1.5px dashed var(--line); background:#FBFAF7; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#8B8A80; font-size:22px; position:relative; overflow:hidden;}
.store-search{position:relative; margin-bottom:14px;}
.store-list-group{margin-bottom:18px;}
.store-list-group h3{font-size:13px; display:flex; align-items:center; gap:8px; margin:0 0 8px;}
.store-row{display:flex; justify-content:space-between; align-items:center; padding:11px 14px; border:1px solid var(--line); border-radius:8px; margin-bottom:7px; background:#fff;}
.store-row:hover{border-color:var(--teal);}
.store-row .meta{font-size:12px; color:#8B8A80;}
@media print{
  @page{ margin:14mm; }
  .no-print{display:none !important;}
  #app{display:block;}
  .main{padding:0; max-width:none;}
  body{background:#fff;}
  .card{box-shadow:none; border:none; padding:0; margin:0;}
  .sec-block{page-break-inside:avoid;}
  img{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
@media (max-width:820px){
  .sidenav{position:fixed; top:auto; bottom:0; left:0; right:0; width:100%; height:auto; flex-direction:row;
    padding:8px; z-index:200; border-top:1px solid rgba(255,255,255,.1);}
  .brand-mark, .navfoot{display:none;}
  .navbtn{flex-direction:column; font-size:10.5px; gap:3px; padding:7px 4px; text-align:center;}
  .main{padding:18px 14px 90px;}
  .fab-new-audit{top:12px; right:12px; padding:9px 14px; font-size:12.5px;}
  .sync-badge{top:56px; left:auto; right:12px; padding:5px 10px; font-size:10.5px;}
}
</style>
</head>

/* ---------------- Scorecard upload & extraction engine ---------------- */
const MONTH_NAME_MAP = {
  'januar':1,'january':1,'februar':2,'february':2,'märz':3,'marz':3,'march':3,'april':4,
  'mai':5,'may':5,'juni':6,'june':6,'juli':7,'july':7,'august':8,
  'september':9,'oktober':10,'october':10,'november':11,'dezember':12,'december':12
};
const SEMESTER_MONTHS = { 1:[1,2,3,4,5,6], 2:[7,8,9,10,11,12] };

function colorForValue(rules, value){
  if(value == null) return null;
  for(const [op,f1,f2,color] of rules){
    if(f1 == null) continue;
    if(op==='lessThan' && value < f1) return color;
    if(op==='greaterThan' && value > f1) return color;
    if(op==='between' && f2 != null && value >= f1 && value <= f2) return color;
  }
  return null;
}

function findMonthColumnsForYear(rows, targetYear, maxScanRows){
  maxScanRows = Math.min(maxScanRows || 30, rows.length);
  for(let r=0; r<maxScanRows; r++){
    const row = rows[r] || [];
    const yearCols = [];
    row.forEach((v,c)=>{ if(Number(v)===targetYear) yearCols.push(c); });
    if(yearCols.length >= 4){
      const monthRow = rows[r+1] || [];
      const result = {};
      yearCols.forEach(c=>{
        const mv = monthRow[c];
        if(typeof mv === 'string'){
          const key = mv.trim().toLowerCase();
          if(MONTH_NAME_MAP[key]) result[MONTH_NAME_MAP[key]] = c;
        }
      });
      if(Object.keys(result).length >= 3) return result;
    }
  }
  return null;
}

// Parses one uploaded workbook for one brand + target period. Returns
// {result: {storeName: {metricKey: {value,color,n_months}}}, matchedSheets, unmatchedSheets}
function extractScorecardFromWorkbook(workbook, brandCode, targetYear, targetSemester){
  const engine = SCORECARD_ENGINE[brandCode];
  const result = {};
  const matchedSheets = [];
  const unmatchedSheets = [];
  const wantedMonths = SEMESTER_MONTHS[targetSemester];

  Object.keys(engine.sheetMap).forEach(sheetName=>{
    const storeName = engine.sheetMap[sheetName];
    const sheet = workbook.Sheets[sheetName];
    if(!sheet){ unmatchedSheets.push(sheetName); return; }
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:null});
    const monthCols = findMonthColumnsForYear(rows, targetYear);
    if(!monthCols){ unmatchedSheets.push(sheetName + ' (no ' + targetYear + ' data found)'); return; }
    const storeData = {};
    engine.metrics.forEach(({key, row})=>{
      const row0 = row - 1;
      const vals = [];
      wantedMonths.forEach(m=>{
        const c = monthCols[m];
        if(c == null) return;
        const v = (rows[row0] || [])[c];
        if(typeof v === 'number') vals.push(v);
      });
      if(!vals.length) return;
      const avg = vals.reduce((a,b)=>a+b,0) / vals.length;
      const rules = (engine.thresholds[key] || []).map(([op,f1,f2,color])=>[op,f1,f2,color]);
      const color = colorForValue(rules, avg);
      storeData[key] = {value: Math.round(avg*10000)/10000, color, n_months: vals.length};
    });
    if(Object.keys(storeData).length){
      result[storeName] = storeData;
      matchedSheets.push(sheetName);
    } else {
      unmatchedSheets.push(sheetName + ' (no numeric data for that period)');
    }
  });
  return {result, matchedSheets, unmatchedSheets};
}

/* ---------------- Storage layer ---------------- */
// Priority: 1) Claude's own storage (when viewed inside Claude) 2) Supabase (real
// cross-device sync, when opened standalone with a working Supabase project)
// 3) this browser's own localStorage (last-resort fallback, local to this device only).
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
const SPEECH_SUPPORTED = !!SpeechRecognitionAPI;
const LOCAL_PREFIX = 'biannual_audit_';

const SUPABASE_URL = 'https://pkmkxcfwnlmugcggbdfk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_puP4YSabm4wn86LOMTnftw_4jXoRlRT';

};

let STORAGE_MODE = (typeof window.storage !== 'undefined') ? 'cloud' : 'pending';
window.__cloudInitError = null;

async function initStorageMode(){
  if(STORAGE_MODE === 'cloud') return;
  try{
    // Quick reachability check against the table (limit 1, no rows needed)
    const resp = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?select=Key&limit=1`, {
      headers: supabaseHeaders
    });
    if(resp.ok){
      STORAGE_MODE = 'supabase';
    } else {
      const body = await resp.text().catch(()=> '');
      window.__cloudInitError = `Supabase responded with ${resp.status}: ${body.slice(0,300)}`;
      STORAGE_MODE = 'local';
    }
  }catch(e){
    window.__cloudInitError = (e && e.message) ? e.message : String(e);
    STORAGE_MODE = 'local';
  }
}

}

async function storageGet(key){
  if(STORAGE_MODE === 'cloud'){
    try{
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }
  if(STORAGE_MODE === 'supabase'){
    try{
      const resp = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?Key=eq.${encodeURIComponent(key)}&select=Value`, {
        headers: supabaseHeaders
      });
      if(!resp.ok) return null;
      const rows = await resp.json();
      return (rows && rows.length) ? rows[0].Value : null;
    }catch(e){ console.error('supabase get failed', key, e); return null; }
  }
  try{
    const v = localStorage.getItem(LOCAL_PREFIX+key);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  if(STORAGE_MODE === 'cloud'){
    try{ await window.storage.set(key, JSON.stringify(value), false); return true; }
    catch(e){ console.error('storage set failed', key, e); return false; }
  }
  if(STORAGE_MODE === 'supabase'){
    try{
      const resp = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}`, {
        method: 'POST',
        headers: Object.assign({}, supabaseHeaders, {'Prefer': 'resolution=merge-duplicates'}),
        body: JSON.stringify({ Key: key, Value: value })
      });
      return resp.ok;
    }catch(e){ console.error('supabase set failed', key, e); return false; }
  }
  try{ localStorage.setItem(LOCAL_PREFIX+key, JSON.stringify(value)); return true; }
  catch(e){ console.error('local storage set failed', key, e); return false; }
}
async function storageDelete(key){
  if(STORAGE_MODE === 'cloud'){
    try{ await window.storage.delete(key, false); }catch(e){}
    return;
  }
  if(STORAGE_MODE === 'supabase'){
    try{
      await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?Key=eq.${encodeURIComponent(key)}`, {
        method: 'DELETE',
        headers: supabaseHeaders
      });
    }catch(e){ console.error('supabase delete failed', key, e); }
    return;
  }
  try{ localStorage.removeItem(LOCAL_PREFIX+key); }catch(e){}
}
async function storageListKeys(prefix){
  if(STORAGE_MODE === 'cloud'){
    try{ const r = await window.storage.list(prefix, false); return r ? r.keys : []; }
    catch(e){ return []; }
  }
  if(STORAGE_MODE === 'supabase'){
    try{
      const filter = prefix ? `&Key=like.${encodeURIComponent(prefix)}*` : '';
      const resp = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?select=Key${filter}`, {
        headers: supabaseHeaders
      });
      if(!resp.ok) return [];
      const rows = await resp.json();
      return rows.map(r=>r.Key);
    }catch(e){ console.error('supabase list failed', e); return []; }
  }
  try{
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(LOCAL_PREFIX+(prefix||''))) keys.push(k.slice(LOCAL_PREFIX.length));
    }
    return keys;
  }catch(e){ return []; }
}

function ensureConfigIds(config){

    (b.sections||[]).forEach(sec=>{
      if(!sec.id) sec.id = uid('sec');
      (sec.subs||[]).forEach(sub=>{
        if(!sub.id) sub.id = uid('sub');
        (sub.questions||[]).forEach(q=>{
          if(!q.id) q.id = uid('q');
        });
      });
    });
  });
  return config;
}

function brandTotalWeight(brandConfig){
  let total = 0;
  (brandConfig.sections||[]).forEach(sec=>(sec.subs||[]).forEach(sub=>(sub.questions||[]).forEach(q=>{ total += Number(q.weight)||0; })));
  return total;
}

/* ---------------- Boot ---------------- */
async function boot(){
  await initStorageMode();
  const [stores, config, auditIndex, savedScorecardRef] = await Promise.all([
    storageGet('stores'),
    storageGet('config'),
    storageGet('audit_index'),
    storageGet('scorecard_ref'),
  ]);
  state.stores = stores || sampleStores();
  state.config = ensureConfigIds(config || clone(DEFAULT_CONFIG));
  state.auditIndex = auditIndex || [];
  if(savedScorecardRef) SCORECARD_REF = savedScorecardRef;
  state.loaded = true;
  if(!stores) await storageSet('stores', state.stores);
  if(!config) await storageSet('config', state.config);
  render();
}

async function applyAMAssignments(){
  let matched = 0, unmatched = [];
  AM_ASSIGNMENTS.forEach(([brand, name, am])=>{
    const store = state.stores.find(s=>s.brand===brand && s.name===name);
    if(store){ store.am = am; matched++; }
    else unmatched.push(`${name} (${brand})`);
  });
  await storageSet('stores', state.stores);
  return {matched, unmatched};
}

    ${!state.viewingExport ? `<button class="btn btn-primary fab-new-audit no-print" id="fab-new-audit" title="Start a new audit">+ New audit</button>` : ''}
  `;
  document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click', ()=>setRoute(b.dataset.route)));
  const fab = document.getElementById('fab-new-audit');
  if(fab) fab.addEventListener('click', ()=>openNewAuditModal());
  const syncBadgeBtn = document.getElementById('sync-badge-btn');
  if(syncBadgeBtn) syncBadgeBtn.addEventListener('click', showStorageDiagnostics);
  const main = document.getElementById('main');
  if(state.viewingExport){ renderExportView(main, state.viewingExport); return; }
  if(state.route === 'dashboard') renderDashboardView(main);

function navBtn(route, label, icon){
  return `<button class="navbtn ${state.route===route?'active':''}" data-route="${route}">${icon}<span>${label}</span></button>`;
}

function brandName(code){ return (state.config[code] && state.config[code].name) || code; }
function brandColor(code){ return `var(--${code})`; }

let storesSearch = '';
let storesFilterBrand = 'all';
let storesFilterAM = 'all';

function brandChipStyle(brand){
  return {
    DD:  {bg:'#FF6B35', fg:'#ffffff', accent:'#FF2E92'}, // Dunkin' — orange & pink
    PF:  {bg:'#15130A', fg:'#F2C230', accent:'#F2C230'}, // Pommes Freunde — black & yellow
    SW:  {bg:'#0F9D58', fg:'#FFE347', accent:'#FFE347'}, // Subway — green & yellow
    DND: {bg:'#DCDAD2', fg:'#8C1D14', accent:'#C24B3D'}, // Dean & David — light grey & red
  }[brand] || {bg:'#EEEDE7', fg:'#3A4250', accent:'#B3B0A3'};
}

function renderStoresView(main){
  const brandCodes = Object.keys(state.config);
  const amSet = new Set();
  state.stores.forEach(s=>{ if(s.am) amSet.add(s.am.toUpperCase()); });
  const amList = Array.from(amSet).sort();

  function getFiltered(){
    const q = storesSearch.toLowerCase();
    return state.stores.filter(s=>{
      if(storesFilterBrand !== 'all' && s.brand !== storesFilterBrand) return false;
      if(storesFilterAM !== 'all' && (s.am||'').toUpperCase() !== storesFilterAM) return false;
      if(q && !s.name.toLowerCase().includes(q) && !(s.city||'').toLowerCase().includes(q)) return false;
      return true;
    }).sort((a,b)=> a.name.localeCompare(b.name, undefined, {sensitivity:'base'}));
  }
  function rowsHTML(visibleStores){
    return visibleStores.map(s => {
      const c = brandChipStyle(s.brand);
      return `
      <tr data-id="${s.id}">
        <td style="border-left:5px solid ${c.accent};"><input type="text" class="store-name" value="${esc(s.name)}" style="min-width:160px;background:${c.bg};color:${c.fg};border-color:${c.accent};font-weight:600;"></td>
        <td>
          <select class="store-brand" style="background:${c.bg};color:${c.fg};border-color:${c.accent};font-weight:700;">
            ${brandCodes.map(bc=>`<option value="${bc}" ${s.brand===bc?'selected':''}>${esc(brandName(bc))}</option>`).join('')}
          </select>
        </td>
        <td><input type="text" class="store-am" value="${esc(s.am||'')}" placeholder="e.g. MH" style="min-width:70px;text-transform:uppercase;" maxlength="6"></td>
        <td><button class="btn btn-sm btn-danger del-store">Remove</button></td>
      </tr>
    `;
    }).join('');
  }

  const visibleStores = getFiltered();

  main.innerHTML = `
    <div class="pagehead">
      <div><h1>Stores</h1><p>Manage your ${state.stores.length} stores, their brand, and the Area Manager (AM) responsible — this powers the brand/AM filters on the Dashboard.</p></div>
      <div style="display:flex;gap:8px;">
        <button class="btn" id="load-real-btn">Load full store list (${REAL_STORES.length})</button>
        <button class="btn" id="load-am-btn">Load AM assignments</button>
        <button class="btn btn-primary" id="add-store-btn">+ Add store</button>
      </div>
    </div>

    <div class="card" style="display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap;">
      <div style="flex:1;min-width:220px;">
        <label class="field">Search</label>
        <input type="text" id="stores-search" placeholder="Store name or city…" value="${esc(storesSearch)}">
      </div>
      <div>
        <label class="field">Brand</label>
        <div class="pillrow" id="stores-brand-pills">
          <button class="pill ${storesFilterBrand==='all'?'active':''}" style="${storesFilterBrand==='all'?'background:var(--ink);color:#fff':''}" data-brand="all">All brands</button>
          ${brandCodes.map(c=>`<button class="pill ${storesFilterBrand===c?'active':''}" style="${storesFilterBrand===c?`background:${brandColor(c)}`:''}" data-brand="${c}">${esc(brandName(c))}</button>`).join('')}
        </div>
      </div>
      <div>
        <label class="field">Area Manager</label>
        <div class="pillrow" id="stores-am-pills">
          <button class="pill ${storesFilterAM==='all'?'active':''}" style="${storesFilterAM==='all'?'background:var(--ink);color:#fff':''}" data-am="all">All AMs</button>
          ${amList.map(am=>`<button class="pill ${storesFilterAM===am?'active':''}" style="${storesFilterAM===am?'background:var(--teal)':''}" data-am="${esc(am)}">${esc(am)}</button>`).join('')}
          ${!amList.length ? `<span class="hint">None set yet</span>` : ''}
        </div>
      </div>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>Store name</th><th>Brand</th><th>AM</th><th></th></tr></thead>
        <tbody id="store-rows">${rowsHTML(visibleStores) || `<tr><td colspan="4" style="color:#8B8A80">${state.stores.length ? 'No stores match this search/filter.' : 'No stores yet — add one above or import a list below.'}</td></tr>`}</tbody>
      </table>
      <div class="hint" id="stores-count-hint" style="margin-top:10px;">Showing ${visibleStores.length} of ${state.stores.length} stores</div>
    </div>

    <div class="card">
      <h2 style="font-size:15px;margin:0 0 6px;">Bulk import</h2>
      <p class="hint" style="margin-bottom:10px;">Paste one store per line, formatted as <span class="mono">Name, Brand, City, AM initials</span> (AM is optional) — brand can be ${brandCodes.map(c=>`<b>${c}</b> (${esc(brandName(c))})`).join(', ')}. Example: <span class="mono">Karlsruhe, DD, Karlsruhe, MH</span></p>
      <textarea id="import-text" rows="6" placeholder="Karlsruhe, DD, Karlsruhe, MH
Bayreuth, DD, Bayreuth, KO
N-FC, PF, Nürnberg, AN"></textarea>
      <div style="margin-top:10px;"><button class="btn btn-primary" id="import-btn">Import stores</button></div>
    </div>
  `;

  function wireRows(){
    main.querySelectorAll('#store-rows tr[data-id]').forEach(tr=>{
      const id = tr.dataset.id;
      const store = state.stores.find(s=>s.id===id);
      const save = async ()=>{
        store.name = tr.querySelector('.store-name').value;
        store.brand = tr.querySelector('.store-brand').value;
        store.am = tr.querySelector('.store-am').value.toUpperCase();
        await storageSet('stores', state.stores);
        const c = brandChipStyle(store.brand);
        const sel = tr.querySelector('.store-brand');
        const nameInput = tr.querySelector('.store-name');
        sel.style.background = c.bg; sel.style.color = c.fg; sel.style.borderColor = c.accent;
        nameInput.style.background = c.bg; nameInput.style.color = c.fg; nameInput.style.borderColor = c.accent;
        tr.querySelector('td').style.borderLeft = `5px solid ${c.accent}`;
      };
      tr.querySelectorAll('input, select').forEach(el=>el.addEventListener('change', save));
      tr.querySelector('.del-store').addEventListener('click', async ()=>{
        if(!(await confirmModal(`Remove "${store.name}"?`, 'Remove'))) return;
        state.stores = state.stores.filter(s=>s.id!==id);
        await storageSet('stores', state.stores);
        refreshRows();
        document.querySelector('.pagehead p').textContent = `Manage your ${state.stores.length} stores, their brand, and the Area Manager (AM) responsible — this powers the brand/AM filters on the Dashboard.`;
      });
    });
  }
  function refreshRows(){
    const vs = getFiltered();
    document.getElementById('store-rows').innerHTML = rowsHTML(vs) || `<tr><td colspan="4" style="color:#8B8A80">${state.stores.length ? 'No stores match this search/filter.' : 'No stores yet — add one above or import a list below.'}</td></tr>`;
    document.getElementById('stores-count-hint').textContent = `Showing ${vs.length} of ${state.stores.length} stores`;
    wireRows();
  }

  document.getElementById('stores-search').addEventListener('input', e=>{ storesSearch = e.target.value; refreshRows(); });
  main.querySelectorAll('#stores-brand-pills .pill').forEach(p=>p.addEventListener('click', ()=>{ storesFilterBrand = p.dataset.brand; render(); }));
  main.querySelectorAll('#stores-am-pills .pill').forEach(p=>p.addEventListener('click', ()=>{ storesFilterAM = p.dataset.am; render(); }));

  document.getElementById('load-real-btn').addEventListener('click', async ()=>{
    if(!(await confirmModal(`Replace the current ${state.stores.length} stores with the real list of ${REAL_STORES.length} stores parsed from your files? This can't be undone.`, 'Replace'))) return;
    state.stores = sampleStores();
    await storageSet('stores', state.stores);
    showToast(`Loaded ${state.stores.length} stores`);
    render();
  });

  document.getElementById('load-am-btn').addEventListener('click', async ()=>{
    if(!(await confirmModal(`Apply Area Manager initials from your AM list to matching stores? This overwrites the AM field for any store name that matches.`, 'Apply'))) return;
    const {matched, unmatched} = await applyAMAssignments();
    showToast(`Set AM for ${matched} store${matched===1?'':'s'}${unmatched.length?`, ${unmatched.length} not found`:''}`);
    render();
  });

  document.getElementById('add-store-btn').addEventListener('click', async ()=>{
    state.stores.push({id: uid('store'), name:'New store', brand: brandCodes[0], city:'', am:''});
    await storageSet('stores', state.stores);
    render();
  });

  document.getElementById('import-btn').addEventListener('click', async ()=>{
    const text = document.getElementById('import-text').value;
    const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
    let added = 0, skipped = 0;
    lines.forEach(line=>{
      const parts = line.split(',').map(p=>p.trim());
      const name = parts[0];
      let brand = (parts[1]||'').toUpperCase();
      const city = parts[2] || '';
      const am = (parts[3] || '').toUpperCase();
      if(!name || !brandCodes.includes(brand)){ skipped++; return; }
      state.stores.push({id: uid('store'), name, brand, city, am});
      added++;
    });
    await storageSet('stores', state.stores);
    showToast(`Imported ${added} store${added===1?'':'s'}${skipped?`, skipped ${skipped}`:''}`);
    render();
  });

  wireRows();
}

function wireQuestionEditors(wrap, brand){
  const persist = async ()=>{ await storageSet('config', state.config); };
  const rerenderSections = ()=>{ wrap.innerHTML = brand.sections.map(sectionEditorHTML).join(''); wireQuestionEditors(wrap, brand); };

  wrap.querySelectorAll('[data-sec]').forEach(secEl=>{
    const sec = brand.sections.find(s=>s.id===secEl.dataset.sec);
    secEl.querySelector('.sec-en').addEventListener('change', e=>{ sec.name_en = e.target.value; persist(); });
    secEl.querySelector('.sec-de').addEventListener('change', e=>{ sec.name_de = e.target.value; persist(); });
    secEl.querySelector('.del-sec').addEventListener('click', async ()=>{
      if(!(await confirmModal(`Delete section "${sec.name_en}" and all its questions?`, 'Delete'))) return;
      brand.sections = brand.sections.filter(s=>s.id!==sec.id);
      await persist(); render();
    });
    secEl.querySelector('.add-sub').addEventListener('click', async ()=>{
      sec.subs.push({id: uid('sub'), name_en:'New group', name_de:'Neue Gruppe', questions:[{id:uid('q'), text_en:'New question', text_de:'Neue Frage', weight:1}]});
      await persist(); render();
    });

    secEl.querySelectorAll('[data-sub]').forEach(subEl=>{
      const sub = sec.subs.find(s=>s.id===subEl.dataset.sub);
      subEl.querySelector('.sub-en').addEventListener('change', e=>{ sub.name_en = e.target.value; persist(); });
      subEl.querySelector('.sub-de').addEventListener('change', e=>{ sub.name_de = e.target.value; persist(); });
      subEl.querySelector('.del-sub').addEventListener('click', async ()=>{
        if(!(await confirmModal(`Delete group "${sub.name_en}"?`, 'Delete'))) return;
        sec.subs = sec.subs.filter(s=>s.id!==sub.id);
        await persist(); render();
      });
      subEl.querySelector('.add-q').addEventListener('click', async ()=>{
        sub.questions.push({id: uid('q'), text_en:'New question', text_de:'Neue Frage', weight:1});
        await persist(); render();
      });
      subEl.querySelectorAll('[data-q]').forEach(qEl=>{
        const q = sub.questions.find(x=>x.id===qEl.dataset.q);
        qEl.querySelector('.q-en').addEventListener('change', e=>{ q.text_en = e.target.value; persist(); });
        qEl.querySelector('.q-de').addEventListener('change', e=>{ q.text_de = e.target.value; persist(); });
        qEl.querySelector('.q-weight').addEventListener('change', e=>{ q.weight = Number(e.target.value)||0; persist(); render(); });
        qEl.querySelector('.del-q').addEventListener('click', async ()=>{
          sub.questions = sub.questions.filter(x=>x.id!==q.id);
          await persist(); render();
        });
      });
    });
  });
}

let auditStoreSearch = '';
let saveTimer = null;

function computeScore(brandConfig, answers){
  let earned = 0, denom = 0;
  (brandConfig.sections||[]).forEach(sec=>(sec.subs||[]).forEach(sub=>(sub.questions||[]).forEach(q=>{
    const a = answers[q.id];
    if(!a || !a.status && a.points==null) return;
    if(a.status === 'na') return;
    const w = Number(q.weight)||0;
    let pts = null;
    if(typeof a.points === 'number') pts = a.points;
    else if(a.status === 'pass') pts = w;
    else if(a.status === 'fail') pts = 0;
    if(pts === null) return;
    denom += w;
    earned += Math.max(0, Math.min(pts, w));
  })));
  const pct = denom > 0 ? (earned/denom*100) : null;
  return {earned, denom, pct};
}
function isMultiPoint(weight){ return Math.round(Number(weight)||1) > 1; }

function computeSplitScore(brandConfig, answers){
  let perf = {earned:0, denom:0}, ops = {earned:0, denom:0};
  (brandConfig.sections||[]).forEach(sec=>{
    const bucket = (sec.name_en === 'Business Administration') ? perf : ops;
    (sec.subs||[]).forEach(sub=>(sub.questions||[]).forEach(q=>{
      const a = answers[q.id];
      if(!a || !a.status && a.points==null) return;
      if(a.status === 'na') return;
      const w = Number(q.weight)||0;
      let pts = null;
      if(typeof a.points === 'number') pts = a.points;
      else if(a.status === 'pass') pts = w;
      else if(a.status === 'fail') pts = 0;
      if(pts === null) return;
      bucket.denom += w;
      bucket.earned += Math.max(0, Math.min(pts, w));
    }));
  });
  const pctOf = b => b.denom>0 ? (b.earned/b.denom*100) : null;
  return {
    performance: {earned:perf.earned, denom:perf.denom, pct:pctOf(perf)},
    operational: {earned:ops.earned, denom:ops.denom, pct:pctOf(ops)},
  };
}

function autoGrowNote(el){
  el.style.height = '30px';
  const target = Math.max(30, el.scrollHeight);
  el.style.height = target + 'px';
}

async function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const maxDim = 1000;
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim/width); width = maxDim; }
          else { width = Math.round(width * maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.62));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function periodLabel(year, semester){ return `S${semester} ${year}`; }
function getPeriod(obj){
  // obj: an audit or audit-index entry. Falls back to deriving from date for older records.
  if(obj.year && obj.semester) return {year: obj.year, semester: obj.semester};
  const d = obj.date ? new Date(obj.date+'T00:00:00') : new Date();
  return {year: d.getFullYear(), semester: d.getMonth() < 6 ? 1 : 2};
}
function periodSortKey(p){ return p.year*10 + p.semester; }
const YEAR_OPTIONS = (()=>{ const y0 = new Date().getFullYear()-1; const arr=[]; for(let y=y0;y<y0+7;y++) arr.push(y); return arr; })();
let lastUsedPeriod = {year: new Date().getFullYear(), semester: 1};

function findExistingAudit(storeId, year, semester){
  return state.auditIndex.find(a => a.storeId===storeId && getPeriod(a).year===year && getPeriod(a).semester===semester);
}

function findGoogleReviewQuestion(brandConfig){
  for(const sec of brandConfig.sections||[]){
    for(const sub of sec.subs||[]){
      for(const q of sub.questions||[]){
        if(q.text_en && q.text_en.startsWith(GOOGLE_QUESTION_PREFIX)) return q;
      }
    }
  }
  return null;
}
function composeGoogleReviewNote(brand, storeName){
  const entry = (GOOGLE_REF[brand]||{})[storeName];
  if(!entry) return null;
  if(entry.rating == null){
    return `No Google rating yet — ${entry.note||'store likely too new to have reviews.'}`;
  }
  return `★${entry.rating.toFixed(1)} (${entry.count} reviews) as of Sep 2026. ${entry.note} Trend: not measurable from Google data (no historical rating history available) — this reflects current visible reviews only, please confirm on the spot.`;
}

function composeScorecardNote(brand, storeName, questionText){
  const metricKey = (QUESTION_METRIC_MAP[brand]||{})[questionText];
  if(!metricKey) return null;
  const entry = ((SCORECARD_REF[brand]||{})[storeName]||{})[metricKey];
  if(!entry) return null;
  const displayVal = (entry.value*100).toFixed(1)+'%';
  const lowConfidence = entry.n_months < 3;
  return `${METRIC_LABELS[metricKey]||metricKey}: ${displayVal} (avg from scorecard${lowConfidence?`, only ${entry.n_months} month(s) of data — treat as indicative`:''}). Please confirm this matches what you see on the spot.`;
}

async function startNewAudit(store, year, semester){
  const brandConfig = state.config[store.brand];
  const audit = {
    id: uid('audit'), storeId: store.id, storeName: store.name, brand: store.brand, brandName: brandConfig.name,
    auditor:'', date: todayISO(), year, semester, status:'draft',
    answers: {}, createdAt: Date.now(), updatedAt: Date.now()
  };
  const gq = findGoogleReviewQuestion(brandConfig);
  if(gq){
    const note = composeGoogleReviewNote(store.brand, store.name);
    if(note) audit.answers[gq.id] = {status:null, note_en: note, note_de:'', photos:[]};
  }
  // Prefill notes for any Sales/Costs question that has scorecard reference data
  (brandConfig.sections||[]).forEach(sec=>(sec.subs||[]).forEach(sub=>(sub.questions||[]).forEach(q=>{
    if(audit.answers[q.id]) return; // already prefilled (e.g. the Google question above)
    const note = composeScorecardNote(store.brand, store.name, q.text_en);
    if(note) audit.answers[q.id] = {status:null, note_en: note, note_de:'', photos:[]};
  })));
  state.audits[audit.id] = audit;
  state.currentAuditId = audit.id;
  state.auditIndex.unshift({id:audit.id, storeId:store.id, storeName:store.name, brand:store.brand, date:audit.date, year, semester, pct:null, status:'draft'});
  await storageSet('audit:'+audit.id, audit);
  await storageSet('audit_index', state.auditIndex);
}
async function resumeAudit(auditId){
  let audit = state.audits[auditId];
  if(!audit){ audit = await storageGet('audit:'+auditId); state.audits[auditId] = audit; }
  state.currentAuditId = auditId;
  render();
}
function exitAudit(){ state.currentAuditId = null; render(); }

function scheduleSaveAudit(audit){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    audit.updatedAt = Date.now();
    await storageSet('audit:'+audit.id, audit);
    const idx = state.auditIndex.find(a=>a.id===audit.id);
    if(idx){
      const brandConfig = state.config[audit.brand];
      idx.pct = computeScore(brandConfig, audit.answers).pct;
      const split = computeSplitScore(brandConfig, audit.answers);
      idx.perfPct = split.performance.pct;
      idx.opsPct = split.operational.pct;
      idx.storeName = audit.storeName; idx.date = audit.date; idx.status = audit.status;
      idx.year = audit.year; idx.semester = audit.semester;
      await storageSet('audit_index', state.auditIndex);
    }
  }, 450);
}

function renderAuditView(main){
  if(!state.currentAuditId){ renderStorePicker(main); return; }
  const audit = state.audits[state.currentAuditId];
  if(!audit){ renderStorePicker(main); return; }
  renderAuditForm(main, audit);
}

function openNewAuditModal(prefillStoreId){
  const brandCodes = Object.keys(state.config);
  const prefillStore = prefillStoreId ? state.stores.find(s=>s.id===prefillStoreId) : null;
  let modalSearch = '';
  let modalBrandFilter = 'all';

  function storeOptionsHTML(){
    const q = modalSearch.toLowerCase();
    return brandCodes.map(code=>{
      if(modalBrandFilter !== 'all' && modalBrandFilter !== code) return '';
      const stores = state.stores.filter(s=>s.brand===code && (
        !q || s.name.toLowerCase().includes(q) || (s.city||'').toLowerCase().includes(q)
      ));
      if(!stores.length) return '';
      return `<optgroup label="${esc(brandName(code))}">${
        stores.map(s=>`<option value="${s.id}">${esc(s.name)}${s.city?' — '+esc(s.city):''}</option>`).join('')
      }</optgroup>`;
    }).join('');
  }

  const storeFieldHTML = prefillStore ? `
      <label class="field">Store</label>
      <div style="font-weight:700;font-size:14.5px;padding:8px 0 4px;">${esc(prefillStore.name)}${prefillStore.city?` <span style="color:#8B8A80;font-weight:500;">— ${esc(prefillStore.city)}</span>`:''}</div>
      <input type="hidden" id="modal-store" value="${prefillStore.id}">
    ` : `
      <label class="field">Store</label>
      <input type="text" id="modal-store-search" placeholder="Search stores…" style="margin-bottom:8px;">
      <div class="pillrow" id="modal-brand-pills" style="margin-bottom:10px;">
        <button type="button" class="pill active" data-brand="all" style="background:var(--ink);color:#fff;">All brands</button>
        ${brandCodes.map(c=>`<button type="button" class="pill" data-brand="${c}">${esc(brandName(c))}</button>`).join('')}
      </div>
      <select id="modal-store" size="6" style="margin-bottom:12px;">
        ${storeOptionsHTML()}
      </select>
    `;

  const bg = document.createElement('div');
  bg.className = 'modal-bg no-print';
  bg.innerHTML = `
    <div class="modal">
      <h2 style="font-size:16px;margin:0 0 14px;">New audit</h2>
      ${storeFieldHTML}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 6px;">
        <div><label class="field">Semester</label><select id="modal-semester">
          <option value="1" ${lastUsedPeriod.semester===1?'selected':''}>Semester 1</option>
          <option value="2" ${lastUsedPeriod.semester===2?'selected':''}>Semester 2</option>
        </select></div>
        <div><label class="field">Year</label><select id="modal-year">
          ${YEAR_OPTIONS.map(y=>`<option value="${y}" ${lastUsedPeriod.year===y?'selected':''}>${y}</option>`).join('')}
        </select></div>
      </div>
      <div id="modal-warning" style="min-height:20px;margin-bottom:6px;font-size:12.5px;color:var(--red);"></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px;">
        <button class="btn" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-start">Start audit</button>
      </div>
    </div>
  `;
  document.body.appendChild(bg);

  if(!prefillStore){
    const selectEl = bg.querySelector('#modal-store');
    const refreshOptions = ()=>{ selectEl.innerHTML = storeOptionsHTML(); };
    bg.querySelector('#modal-store-search').addEventListener('input', e=>{ modalSearch = e.target.value; refreshOptions(); });
    bg.querySelectorAll('#modal-brand-pills .pill').forEach(p=>{
      p.addEventListener('click', ()=>{
        modalBrandFilter = p.dataset.brand;
        bg.querySelectorAll('#modal-brand-pills .pill').forEach(x=>{
          x.classList.toggle('active', x===p);
          x.style.background = (x===p) ? (modalBrandFilter==='all' ? 'var(--ink)' : brandColor(modalBrandFilter)) : '';
          x.style.color = (x===p) ? '#fff' : '';
        });
        refreshOptions();
      });
    });
  }

  bg.querySelector('#modal-cancel').addEventListener('click', ()=>bg.remove());
  bg.addEventListener('click', e=>{ if(e.target===bg) bg.remove(); });
  bg.querySelector('#modal-start').addEventListener('click', async ()=>{
    const storeId = document.getElementById('modal-store').value;
    const store = state.stores.find(s=>s.id===storeId);
    const semester = Number(document.getElementById('modal-semester').value);
    const year = Number(document.getElementById('modal-year').value);
    const warn = document.getElementById('modal-warning');
    if(!store){ warn.textContent = 'Pick a store first.'; return; }
    const existing = findExistingAudit(storeId, year, semester);
    if(existing){
      warn.innerHTML = `An audit for <b>${esc(store.name)}</b> in <b>${periodLabel(year,semester)}</b> already exists (${existing.status}) — you can't start a second one for the same store &amp; biannual.`;

      btn.className = 'btn btn-sm'; btn.style.marginTop = '8px';
      btn.textContent = existing.status==='finished' ? 'View that report' : 'Resume that draft';
      btn.addEventListener('click', async ()=>{
        bg.remove();
        if(existing.status==='finished'){ await goToExport(existing.id); }
        else { await resumeAudit(existing.id); setRoute('audit'); }
      });
      warn.appendChild(document.createElement('br'));
      warn.appendChild(btn);
      return;
    }
    lastUsedPeriod = {year, semester};
    bg.remove();
    await startNewAudit(store, year, semester);
    setRoute('audit');
  });
}

function questionRowHTML(q, ans, brand, storeName){
  ans = ans || {status:null, note_en:'', photos:[]};
  const badge = scorecardBadgeHTML(brand, storeName, q.text_en);
  const googleBox = googleReviewInfoHTML(brand, storeName, q.text_en);
  const multi = isMultiPoint(q.weight);
  const w = Math.round(Number(q.weight)||1);
  const currentPts = typeof ans.points==='number' ? ans.points : (ans.status==='pass' ? w : (ans.status==='fail' ? 0 : null));
  const buttonsHTML = multi
    ? Array.from({length:w+1}, (_,p)=>`<button class="status-btn pt-btn ${ans.status!=='na' && currentPts===p?'active':''}" data-p="${p}">${p}</button>`).join('')
      + `<button class="status-btn pt-btn" data-s="na" style="${ans.status==='na'?'background:#8B8A80;color:#fff;border-color:#8B8A80;':''}">N/A</button>`
    : `<button class="status-btn ${ans.status==='pass'?'active':''}" data-s="pass">PASS</button>
       <button class="status-btn ${ans.status==='fail'?'active':''}" data-s="fail">FAIL</button>
       <button class="status-btn ${ans.status==='na'?'active':''}" data-s="na">N/A</button>`;
  return `
    <div class="q-row" data-q="${q.id}" data-multi="${multi?'1':'0'}" data-weight="${w}">
      <div>
        <div class="q-text-en">${esc(q.text_en)}<span class="q-weight-tag">wt ${q.weight}</span>${badge}</div>
        <div class="q-text-de">${esc(q.text_de)}</div>
        ${googleBox}
        <div class="q-note-wrap">
          <textarea class="q-note" placeholder="Notes — type in English…" rows="1">${esc(ans.note_en||'')}</textarea>
          ${SPEECH_SUPPORTED ? `<button type="button" class="mic-btn" title="Dictate note (voice to text)">🎤</button>` : ''}
        </div>
        <div class="q-photos">
          ${(ans.photos||[]).map((p,i)=>`<div class="q-photo-thumb"><img src="${p}"><button class="rm" data-i="${i}">✕</button></div>`).join('')}
          <div class="photo-add-btn" title="Choose file from disk" style="position:relative;">+<input type="file" accept="image/*" multiple class="photo-input" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;"></div>
        </div>
      </div>
      <div class="status-group">
        ${buttonsHTML}
      </div>
    </div>
  `;
}

function updateScoreDial(brand, audit){
  const {pct} = computeScore(brand, audit.answers);
  const dial = document.getElementById('score-dial');
  const num = document.getElementById('score-number');
  if(dial && num){
    dial.style.background = pct===null ? 'var(--line)' : `conic-gradient(var(--teal) ${pct}%, var(--line) 0)`;
    num.textContent = pct===null ? '—' : Math.round(pct)+'%';
  }
  const split = computeSplitScore(brand, audit.answers);
  const perfEl = document.getElementById('perf-score');
  const opsEl = document.getElementById('ops-score');
  if(perfEl) perfEl.textContent = split.performance.pct===null ? '—' : Math.round(split.performance.pct)+'%';
  if(opsEl) opsEl.textContent = split.operational.pct===null ? '—' : Math.round(split.operational.pct)+'%';
}

function wireQuestionRows(wrap, audit, brand){
  wrap.querySelectorAll('.q-row').forEach(row=>{
    const qid = row.dataset.q;
    audit.answers[qid] = audit.answers[qid] || {status:null, note_en:'', note_de:'', photos:[]};
    const ans = audit.answers[qid];

    const weight = Number(row.dataset.weight)||1;
    const refreshButtonStates = ()=>{
      row.querySelectorAll('.status-btn').forEach(b=>{
        if(b.dataset.p !== undefined){
          const p = Number(b.dataset.p);
          b.classList.toggle('active', ans.status!=='na' && ans.points===p);
        } else {
          b.classList.toggle('active', b.dataset.s===ans.status);
        }
      });
    };
    row.querySelectorAll('.status-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(btn.dataset.p !== undefined){
          const p = Number(btn.dataset.p);
          const already = ans.status!=='na' && ans.points===p;
          ans.points = already ? null : p;
          ans.status = null;
        } else {
          const s = btn.dataset.s;
          if(s==='na'){
            ans.status = (ans.status==='na') ? null : 'na';
            if(ans.status==='na') ans.points = null;
          } else {
            ans.status = (ans.status === s) ? null : s;
          }
        }
        refreshButtonStates();
        scheduleSaveAudit(audit);
        updateScoreDial(brand, audit);
      });
    });

    const noteEl = row.querySelector('.q-note');
    autoGrowNote(noteEl);
    noteEl.addEventListener('input', e=>{
      ans.note_en = e.target.value;
      autoGrowNote(e.target);
      scheduleSaveAudit(audit);
    });

    const micBtn = row.querySelector('.mic-btn');
    if(micBtn && SPEECH_SUPPORTED){
      let recognizer = null;
      let baseText = '';
      micBtn.addEventListener('click', ()=>{
        if(recognizer){
          recognizer.stop();
          return;
        }
        recognizer = new SpeechRecognitionAPI();
        recognizer.lang = 'en-US';
        recognizer.continuous = true;
        recognizer.interimResults = true;
        baseText = noteEl.value ? noteEl.value.replace(/\s+$/, '') + ' ' : '';
        micBtn.classList.add('listening');
        recognizer.onresult = (ev)=>{
          let transcript = '';
          for(let i=0; i<ev.results.length; i++) transcript += ev.results[i][0].transcript;
          noteEl.value = baseText + transcript;
          ans.note_en = noteEl.value;
          autoGrowNote(noteEl);
        };
        recognizer.onerror = (ev)=>{
          console.error('speech recognition error', ev.error);
          if(ev.error === 'not-allowed' || ev.error === 'service-not-allowed'){
            showToast('Microphone permission denied — check your browser settings.');
          }
        };
        recognizer.onend = ()=>{
          micBtn.classList.remove('listening');
          recognizer = null;
          scheduleSaveAudit(audit);
        };
        try{ recognizer.start(); }
        catch(e){ console.error('could not start recognizer', e); micBtn.classList.remove('listening'); recognizer = null; }
      });
    }

    const handlePhotoFiles = async (fileList)=>{
      const files = Array.from(fileList||[]);
      if(!files.length) return;
      for(const f of files){
        try{
          const dataUrl = await compressImage(f);
          ans.photos = ans.photos || [];
          ans.photos.push(dataUrl);
        }catch(err){ console.error('photo compress failed', err); }
      }
      refreshPhotoThumbs(row, ans, audit);
      scheduleSaveAudit(audit);
    };
    row.querySelector('.photo-input').addEventListener('change', async e=>{
      await handlePhotoFiles(e.target.files);
      e.target.value = '';
    });

    refreshPhotoThumbs(row, ans, audit);
  });
}

function refreshPhotoThumbs(row, ans, audit){
  const photosWrap = row.querySelector('.q-photos');
  const addBtn = photosWrap.querySelector('.photo-add-btn');
  photosWrap.querySelectorAll('.q-photo-thumb').forEach(el=>el.remove());
  (ans.photos||[]).forEach((p,i)=>{
    const div = document.createElement('div');
    div.className = 'q-photo-thumb';
    div.innerHTML = `<img src="${p}"><button class="rm" data-i="${i}">✕</button>`;
    photosWrap.insertBefore(div, addBtn);
  });
  photosWrap.querySelectorAll('.rm').forEach(btn=>btn.addEventListener('click', ()=>{
    ans.photos.splice(Number(btn.dataset.i), 1);
    refreshPhotoThumbs(row, ans, audit);
    scheduleSaveAudit(audit);
  }));
}

function auditHistoryByStore(){
  // Returns {storeId: [finished audits sorted most-recent-period first]}
  const byStore = {};
  state.auditIndex.forEach(a=>{
    if(a.status !== 'finished') return;
    (byStore[a.storeId] = byStore[a.storeId] || []).push(a);
  });
  Object.values(byStore).forEach(arr=>{
    arr.sort((a,b)=> periodSortKey(getPeriod(b)) - periodSortKey(getPeriod(a)));
  });
  return byStore;
}

function renderDashboardView(main){
  const history = auditHistoryByStore();
  const brandCodes = Object.keys(state.config);

  state.stores.forEach(s=>{ if(s.am) amSet.add(s.am.toUpperCase()); });
  const amList = Array.from(amSet).sort();

  let rows = state.stores.map(s => {
    const arr = history[s.id] || [];
    const a = arr[0];      // most recent finished audit
    const prev = arr[1];   // the biannual before that, if any
    return {
      store: s,
      pct: a ? a.pct : null,
      perfPct: a ? a.perfPct : null,
      opsPct: a ? a.opsPct : null,
      date: a ? a.date : null,
      hasAudit: !!a,
      prevPct: prev ? prev.pct : null,

  if(dashFilterBrand !== 'all') rows = rows.filter(r => r.store.brand === dashFilterBrand);
  if(dashFilterAM !== 'all') rows = rows.filter(r => (r.store.am||'').toUpperCase() === dashFilterAM);

  const audited = rows.filter(r=>r.hasAudit).sort((a,b)=>{
    const diff = (b.pct||0) - (a.pct||0);
    if(Math.abs(diff) > 0.001) return diff; // clear winner on current score
    // Tie on current score: whoever scored higher in the previous biannual ranks first
    const aPrev = a.prevPct==null ? -1 : a.prevPct;
    const bPrev = b.prevPct==null ? -1 : b.prevPct;
    if(aPrev !== bPrev) return bPrev - aPrev;
    return a.store.name.localeCompare(b.store.name); // final stable tiebreak
  });
  const notAudited = rows.filter(r=>!r.hasAudit).sort((a,b)=> a.store.name.localeCompare(b.store.name));

  const avg = audited.length ? Math.round(audited.reduce((s,r)=>s+r.pct,0)/audited.length) : null;

/* =========================================================================
   TRENDS VIEW  (store scores across biannual periods, S1/S2 per year)
   ========================================================================= */
let trendsFilterBrand = 'all';
let trendsFilterAM = 'all';
let trendsMetric = 'pct';
const TRENDS_METRIC_LABELS = {pct:'Overall', perfPct:'Performance & Sales', opsPct:'Operational visit'};

function buildTrendsData(filterBrand, filterAM, metricKey){
  metricKey = metricKey || 'pct';
  const finished = state.auditIndex.filter(a=>a.status==='finished');
  const periodMap = new Map();
  finished.forEach(a=>{ const p=getPeriod(a); periodMap.set(periodSortKey(p), p); });
  const periods = Array.from(periodMap.values()).sort((a,b)=>periodSortKey(a)-periodSortKey(b));

  let stores = state.stores.slice();
  if(filterBrand !== 'all') stores = stores.filter(s=>s.brand===filterBrand);
  if(filterAM !== 'all') stores = stores.filter(s=>(s.am||'').toUpperCase()===filterAM);

  const matrix = stores.map(s=>{
    const byPeriod = {};
    periods.forEach(p=>{
      const candidates = finished.filter(a=>a.storeId===s.id && periodSortKey(getPeriod(a))===periodSortKey(p));
      if(candidates.length){
        candidates.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
        byPeriod[periodSortKey(p)] = candidates[0][metricKey];
      }
    });
    return {store:s, byPeriod};
  }).filter(m => Object.values(m.byPeriod).some(v=>v!=null));

  const avgByPeriod = periods.map(p=>{
    const vals = matrix.map(m=>m.byPeriod[periodSortKey(p)]).filter(v=>v!=null);
    return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  });

  return {periods, matrix, avgByPeriod, totalStores: stores.length};
}

function sparklineSVG(periods, values, opts){
  opts = opts || {};
  const w = Math.max(260, periods.length * 90);
  const h = 130, padX = 30, padY = 18;
  const pts = values.map((v,i)=> v==null ? null : {
    x: padX + (periods.length<=1 ? 0 : i*(w-2*padX)/(periods.length-1)),
    y: padY + (1 - v/100)*(h-2*padY)
  });
  const validPts = pts.filter(Boolean);
  const line = pts.map((p,i)=> p ? `${i===0||!pts[i-1]?'M':'L'}${p.x},${p.y}` : '').join(' ');
  const dots = pts.map((p,i)=> p ? `<circle cx="${p.x}" cy="${p.y}" r="4" fill="${opts.color||'var(--teal)'}"/>
    <text x="${p.x}" y="${p.y-10}" font-size="11" font-weight="700" text-anchor="middle" fill="${opts.color||'var(--teal)'}" font-family="IBM Plex Mono, monospace">${Math.round(values[i])}%</text>` : '').join('');
  const labels = periods.map((p,i)=> `<text x="${padX + (periods.length<=1?0:i*(w-2*padX)/(periods.length-1))}" y="${h-2}" font-size="11" text-anchor="middle" fill="#8B8A80">${periodLabel(p.year,p.semester)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;height:${h}px;">
    <line x1="${padX}" y1="${padY + (1-0.85)*(h-2*padY)}" x2="${w-padX}" y2="${padY + (1-0.85)*(h-2*padY)}" stroke="var(--line)" stroke-dasharray="3,3"/>
    <path d="${line}" fill="none" stroke="${opts.color||'var(--teal)'}" stroke-width="2.5"/>
    ${dots}
    ${labels}
  </svg>`;
}

async function generateStoreBriefing(store){
  const brandConfig = state.config[store.brand];
  const history = (auditHistoryByStore()[store.id] || []).slice(0,3);

  const periodSummaries = [];
  for(const idx of history){
    const p = getPeriod(idx);
    let audit = state.audits[idx.id];
    if(!audit){ audit = await storageGet('audit:'+idx.id); state.audits[idx.id] = audit; }
    if(!audit) continue;
    if(audit.isHistorical){
      periodSummaries.push(`${periodLabel(p.year,p.semester)} — Score ${idx.pct==null?'—':Math.round(idx.pct)}%. Notes: ${audit.historicalSummary || '(none)'}`);
    } else {
      const fails = [];
      const passesWithNotes = [];
      (brandConfig.sections||[]).forEach(sec=>(sec.subs||[]).forEach(sub=>(sub.questions||[]).forEach(q=>{
        const a = audit.answers[q.id];
        if(!a) return;
        const failed = a.status==='fail' || (typeof a.points==='number' && a.points===0);
        if(failed){
          fails.push(a.note_en ? `${q.text_en}: ${a.note_en}` : q.text_en);
        } else if(a.note_en && a.note_en.trim()){
          passesWithNotes.push(`${q.text_en}: ${a.note_en}`);
        }
      })));
      let summary = `${periodLabel(p.year,p.semester)} — Score ${idx.pct==null?'—':Math.round(idx.pct)+'%'} (Perf ${idx.perfPct==null?'—':Math.round(idx.perfPct)+'%'}, Ops ${idx.opsPct==null?'—':Math.round(idx.opsPct)+'%'}).`;
      if(fails.length) summary += ` Failed/flagged items: ${fails.slice(0,10).join(' | ')}.`;
      if(passesWithNotes.length) summary += ` Other notes: ${passesWithNotes.slice(0,6).join(' | ')}.`;
      periodSummaries.push(summary);
    }
  }

  const scorecard = (SCORECARD_REF[store.brand]||{})[store.name];
  const scorecardText = scorecard
    ? Object.entries(scorecard).map(([k,v])=>`${METRIC_LABELS[k]||k}: ${(v.value*100).toFixed(1)}%`).join(', ')
    : '';
  const google = (GOOGLE_REF[store.brand]||{})[store.name];
  const googleText = (google && google.rating!=null) ? `Google rating ${google.rating}★ (${google.count} reviews). ${google.note}` : '';

  if(!periodSummaries.length && !scorecardText && !googleText){
    return { error: 'Not enough data yet for this store — complete at least one audit, or load scorecard/Google data, first.' };
  }

  const prompt = `You are helping an Area Manager prepare for a store audit. Here is what's known about "${store.name}" (${brandConfig.name}):

Audit history (most recent first):
${periodSummaries.join('\n') || '(no prior audits on file)'}

Current scorecard KPIs: ${scorecardText || '(none available)'}
Google reviews: ${googleText || '(none available)'}

Write a short, direct briefing (plain text, no markdown headers — just short paragraphs, each starting with a bold-ish label like "Trend:", "Good:", "Watch out for:", "Focus this semester:") covering: (1) the trend over the recent periods (improving/declining/stable, and why), (2) 1-2 genuine positives, (3) 1-2 concerning or recurring issues, (4) 2-3 concrete, constructive things to specifically check or discuss on the upcoming visit. Keep it under 150 words total. Be specific, not generic — reference actual details from the history above where you have them.`;

  try{
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 500,
        messages: [{role:"user", content: prompt}]
      })
    });
    const data = await resp.json();
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    if(!text) return { error: 'Got an empty response — try again.' };
    return { text };
  }catch(e){
    console.error('briefing generation failed', e);
    return { error: 'Could not generate a briefing — this feature only works while using the app inside Claude, not on a standalone-hosted copy (like Netlify). If you\'re inside Claude, check your connection and try again.' };
  }
}

function briefingBoxHTML(text){
  // Render lines like "Trend: ..." with the label bolded
  const lines = text.split(/\n+/).filter(Boolean);
  return lines.map(line=>{
    const m = line.match(/^([A-Za-z][A-Za-z \/&]{2,30}:)(.*)$/);
    if(m) return `<p style="margin:0 0 8px;"><b>${esc(m[1])}</b>${esc(m[2])}</p>`;
    return `<p style="margin:0 0 8px;">${esc(line)}</p>`;
  }).join('');
}

async function translateBatch(texts){
  if(!texts.length) return {results: [], failed:false};
  try{
    const prompt = `Translate each of the following restaurant-audit inspection notes from English to natural, professional business German. Keep them short and in the same style as the original. Respond with ONLY a JSON array of strings in the exact same order, no other text, no markdown fences.\n\n${JSON.stringify(texts)}`;
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{role:"user", content: prompt}]
      })
    });
    const data = await resp.json();
    const textBlock = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const cleaned = textBlock.replace(/```json|```/g,'').trim();
    const arr = JSON.parse(cleaned);
    if(Array.isArray(arr) && arr.length === texts.length) return {results: arr, failed:false};
    return {results: texts.map(()=> ''), failed:true};
  }catch(e){
    console.error('translation failed', e);
    return {results: texts.map(()=> ''), failed:true};
  }
}

async function translateAudit(audit, onProgress){
  const brand = state.config[audit.brand];
  const items = []; // {qid}
  (brand.sections||[]).forEach(sec=>(sec.subs||[]).forEach(sub=>(sub.questions||[]).forEach(q=>{
    const a = audit.answers[q.id];
    if(a && a.note_en && a.note_en.trim()) items.push(q.id);
  })));
  const CHUNK = 8;
  let anyFailed = false;
  for(let i=0;i<items.length;i+=CHUNK){
    const chunk = items.slice(i, i+CHUNK);
    const texts = chunk.map(qid => audit.answers[qid].note_en);
    const {results, failed} = await translateBatch(texts);
    if(failed) anyFailed = true;
    chunk.forEach((qid, j)=>{ audit.answers[qid].note_de = results[j] || ''; });
    if(onProgress) onProgress(Math.min(i+CHUNK, items.length), items.length);
  }
  return {count: items.length, failed: anyFailed};
}
